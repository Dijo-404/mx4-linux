[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mx4-linux"
version = "0.2.0"
description = "A native Linux control panel for Logitech MX Master 4"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["solaar==1.1.20"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["ruff>=0.14,<1", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/Dijo-404/mx4-linux"
Issues = "https://github.com/Dijo-404/mx4-linux/issues"
Changelog = "https://github.com/Dijo-404/mx4-linux/blob/main/CHANGELOG.md"

[project.scripts]
mx4-linux = "mx4_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mx4_linux = ["icons/*.svg", "assets/*.css", "assets/mouse/*.png", "assets/mouse/*.json", "assets/mouse/*.glb", "assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F401", "F63", "F7", "F82"]
