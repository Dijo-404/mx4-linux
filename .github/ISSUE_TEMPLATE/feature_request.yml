name: Feature request
description: Describe a mouse-control or desktop workflow improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the target desktop/compositor and connection type if relevant.
    validations:
      required: true
